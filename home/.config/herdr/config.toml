# Herdr — terminal workspace/pane manager for pi sessions.
# Stowed to ~/.config/herdr/config.toml.
#
# Validate edits:      herdr config check
# Compare to defaults: herdr --default-config
#
# Only intentional deviations from the defaults live here; everything else
# inherits herdr's built-in defaults (shell = $SHELL, ...).

# Skip the first-run onboarding wizard.
onboarding = false

[theme]
# Follow the host terminal's ANSI palette (ghostty's configured colors)
# instead of a bundled theme.
name = "terminal"

[keys]
# Prefix on Ctrl+; keeps Ctrl+b free for shells, editors, and tmux.
prefix = "ctrl+semicolon"

# Memorable splits: \ opens to the right, Enter opens below.
split_vertical = "prefix+backslash"
split_horizontal = "prefix+enter"

# Jump straight to an agent pane by index.
focus_agent = "prefix+alt+1..9"

# Moved from prefix+o to leave it free for Annotate document review.
open_notification_target = "prefix+i"

# Herdr Annotate: terminal comments, document review, and agent feedback.
[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "annotate.capture"
description = "Annotate selected terminal text"

[[keys.command]]
key = "prefix+shift+a"
type = "plugin_action"
command = "annotate.copy-context"
description = "Copy annotations as agent context"

[[keys.command]]
key = "prefix+m"
type = "plugin_action"
command = "annotate.manage"
description = "Manage annotations"

[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "annotate.open"
description = "Review documents in the current folder"

[[keys.command]]
key = "prefix+shift+o"
type = "plugin_action"
command = "annotate.last"
description = "Review the agent's last reply"

[ui.toast]
# In-app toasts when a background agent finishes or needs input.
delivery = "herdr"

[ui.toast.herdr]
position = "top-right"

[ui]
agent_panel_sort = "priority"
show_agent_labels_on_pane_borders = false
status_indicators = "symbols"
confirm_close = true
# Let herdr-automatic-rename name new tabs instead of prompting.
prompt_new_tab_name = false
prompt_new_workspace_name = true

[experimental]
# Save recent pane screen history across full server restarts.
pane_history = true
